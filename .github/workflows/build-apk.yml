name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # GitHub's Ubuntu runners ship with the Android SDK preinstalled.
      - name: Install web dependencies
        run: npm install

      - name: Build the Carfooly frontend
        run: npm run build

      - name: Generate the Android project
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Compile the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk carfooly-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: carfooly-apk
          path: carfooly-debug.apk
          retention-days: 30
